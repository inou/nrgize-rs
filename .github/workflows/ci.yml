name: CI

# Build, test, and lint on every push and pull request. Keeps the issue-sweep fixes (and future
# changes) honest: the full test suite is the contract for the dry-run plans, the secret guards,
# the state-lock behavior, etc.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so a rapid push sequence doesn't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build · test · clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (with clippy)
        run: rustup component add clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # `age` is needed for the secrets round-trip tests (they self-skip if it's missing, but CI
      # should actually exercise the credential pipeline).
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Build
        run: cargo build --all-targets --locked

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked
