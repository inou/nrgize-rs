name: CI

# Build, test, and lint on every push and pull request. Keeps the issue-sweep fixes (and future
# changes) honest: the full test suite is the contract for the dry-run plans, the secret guards,
# the state-lock behavior, etc.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so a rapid push sequence doesn't pile up.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  test:
    name: build · test · clippy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust toolchain (with clippy)
        run: rustup component add clippy rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # `age` is needed for the secrets round-trip tests (they self-skip if it's missing, but CI
      # should actually exercise the credential pipeline).
      - name: Install age
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then brew install age caddy; else sudo apt-get update && sudo apt-get install -y age caddy; fi

      - name: Build
        run: cargo build --all-targets --locked

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --all-targets --locked --no-fail-fast
      - name: Audit fault regressions
        run: python3 tests/audit_regressions.py "$PWD"
      - name: Real age and Caddy regressions
        run: python3 tests/audit_external_regressions.py "$PWD" "$(dirname "$(command -v age)")"

      # Robustness review: "CI robustness" - a secrets-handling deploy tool had no alert for a
      # known-vulnerable dependency. cargo-audit's compiled binary is cached separately, keyed on
      # its own pinned version (not Cargo.lock/Cargo.toml) - the registry/target cache above
      # invalidates on every dependency change, which would otherwise force a ~2 minute rebuild
      # of cargo-audit itself on every routine dependency bump.
      - name: Cache cargo-audit binary
        id: cache-cargo-audit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version ${{ env.CARGO_AUDIT_VERSION }}

      - name: Audit dependencies for known vulnerabilities
        run: cargo audit
