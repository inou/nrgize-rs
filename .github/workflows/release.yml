name: Release

# Roadmap 3.1: cut a GitHub Release with prebuilt binaries whenever a `vX.Y.Z` tag is pushed.
# Nothing here runs on a normal push/PR — this workflow is dormant until a maintainer tags a
# release (`git tag v0.2.0 && git push origin v0.2.0`).
on:
  push:
    tags:
      - 'v*.*.*'

# Read-only by default: the GITHUB_TOKEN's default permissions vary by repo setting, so this is
# explicit rather than relying on whatever the repo default happens to be. Write access is
# granted per job only where needed (`build` for attestations, `release` and `homebrew-pr`
# for contents / pull requests).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag push is a SEPARATE trigger from ci.yml (which only runs on push-to-main / PRs), so
  # without this job a tag pushed from a branch or commit that never went through CI — or one
  # that regressed since it last did — would still produce and publish real release binaries
  # with zero test coverage. Runs the same shared gate as ci.yml.
  test:
    uses: ./.github/workflows/gate.yml

  # Fail loud, before spending build minutes, if the tag and Cargo.toml disagree — a release
  # built from a mismatched Cargo.toml would ship a binary whose own `--version` output lies
  # about what it is.
  check-version:
    name: verify tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compare tag to Cargo.toml version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_version} — bump Cargo.toml and re-tag"
            exit 1
          fi

  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: build (${{ matrix.target }})
    needs: [check-version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Free GitHub-hosted arm64 runner (public repos). If this repo/plan doesn't have
          # access to it, this leg fails loudly rather than silently shipping a release
          # missing linux-arm64 — see docs/roadmap.md 3.1 for the fallback (self-hosted
          # runner, or `cross`).
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # Statically linked builds that run on any Linux regardless of glibc age. scripts/install.sh
          # prefers these and falls back to the gnu assets (which Formula/nrg.rb and installers for
          # releases up to v0.1.4 reference, so their names must not change).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          # Both macOS targets build on the same arm64 runner: cross-compiling
          # x86_64-apple-darwin from an arm64 host works out of the box via Xcode's
          # universal toolchain (no Rosetta needed to BUILD, only to run the result), and it
          # avoids depending on GitHub's Intel macOS runners, which are on a deprecation path.
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install target
        run: rustup target add ${{ matrix.target }}

      # musl-gcc compiles ring's C/asm for the musl targets. Both musl legs build natively
      # (x86_64 on ubuntu-latest, aarch64 on the arm64 runner), so the packaged musl-gcc matches.
      - name: Install musl toolchain
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools file

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The whole point of the musl assets: fail the release if the binary picked up a dynamic
      # libc dependency, and prove it actually runs (the runner is native for each musl leg).
      - name: Verify musl binary is static
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/nrg"
          file "$bin"
          file "$bin" | grep -Eq 'statically linked|static-pie linked' \
            || { echo "::error::$bin is not statically linked"; exit 1; }
          if ldd "$bin" 2>&1 | grep -q 'libc\.so'; then
            echo "::error::$bin links against a shared libc"; exit 1
          fi
          "$bin" --version

      # A single-file archive (the `nrg` binary at the archive root, no wrapping directory) —
      # both scripts/install.sh and Formula/nrg.rb assume this exact layout.
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/nrg" dist/nrg
          archive="nrg-${{ matrix.target }}.tar.gz"
          tar czf "$archive" -C dist nrg
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Attest release archives
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: nrg-${{ matrix.target }}.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nrg-${{ matrix.target }}
          path: |
            nrg-${{ matrix.target }}.tar.gz
            nrg-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    permissions:
      contents: write
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: Combined checksums file
        run: |
          set -euo pipefail
          cd dist
          cat -- *.sha256 > checksums.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/checksums.txt
          generate_release_notes: true

  # Open a PR bumping Formula/nrg.rb to the release just published. GITHUB_TOKEN-created PRs do
  # not trigger other workflows, so homebrew.yml will not run on this PR automatically; a
  # maintainer can re-run it (workflow_dispatch) or push an empty commit to the branch.
  # Requires the repo setting "Allow GitHub Actions to create and approve pull requests".
  # Skipped for pre-release tags (anything with a "-", e.g. v0.2.0-rc.1): the formula only ever
  # points at stable releases. Safe to re-run: the bot branch is force-updated and an open PR for
  # it is reused.
  homebrew-pr:
    name: open Homebrew formula bump PR
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main

      - name: Rewrite formula from checksums.txt
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir "$RUNNER_TEMP"
          python3 scripts/bump-formula.py "$GITHUB_REF_NAME" "$RUNNER_TEMP/checksums.txt"

      - name: Commit and open PR
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/nrg.rb; then
            echo "Formula already at ${GITHUB_REF_NAME}; nothing to do."
            exit 0
          fi
          branch="homebrew-bump-${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -B: reset the branch if a previous (failed or repeated) run already created it locally.
          git checkout -B "$branch"
          git add Formula/nrg.rb
          git commit -m "Point the Homebrew formula at ${GITHUB_REF_NAME}"
          # The branch is bot-owned and regenerated from the release, so a re-run may overwrite it.
          git push --force origin "$branch"
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --state open --json number --jq 'length')"
          if [ "$existing" != "0" ]; then
            echo "A PR for ${branch} is already open; branch updated, nothing more to do."
            exit 0
          fi
          gh pr create --base main --head "$branch" \
            --title "Point the Homebrew formula at ${GITHUB_REF_NAME}" \
            --body "Automated: version and sha256 values regenerated from the ${GITHUB_REF_NAME} release checksums.txt by scripts/bump-formula.py."
