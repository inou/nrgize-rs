[package]
name = "nrg"
version = "0.1.1"
edition = "2021"
description = "Energize — A beautiful SSH task runner"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
crossterm = "0.28"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
dirs = "5"
dialoguer = "0.11"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rhai = { version = "1.25", features = ["sync"] }
fd-lock = "4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
