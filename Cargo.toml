[package]
name = "nrg"
version = "0.1.1"
edition = "2021"
description = "Energize — a Rhai-scripted, fleet-atomic, zero-downtime Docker deploy orchestrator"
license = "MIT"
repository = "https://github.com/inou/nrgize-rs"
homepage = "https://github.com/inou/nrgize-rs"
readme = "README.md"
keywords = ["deploy", "docker", "orchestration", "ssh", "rhai"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rhai = { version = "1.25", features = ["sync", "serde"] }
fd-lock = "4"
tempfile = "3"
signal-hook = "0.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
